<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sổ tay công thức</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-2: #eef2f7;
      --ink: #1c2430;
      --muted: #657386;
      --line: #d9e0ea;
      --primary: #0f766e;
      --primary-strong: #0b5f59;
      --accent: #b45309;
      --danger: #b42318;
      --shadow: 0 14px 35px rgba(28, 36, 48, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 3;
    }
    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 220px;
      gap: 10px;
      align-items: end;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 700;
    }
    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--ink);
      background: var(--surface);
      font-size: 15px;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }
    .stat strong {
      font-size: 22px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--ink);
      font-size: 14px;
    }
    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .sheet-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 12px;
    }
    .sheet-title h2 {
      margin: 0;
      font-size: 22px;
    }
    .sheet-title span {
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    .card-head {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
    }
    .card h3 {
      margin: 0 0 9px;
      font-size: 17px;
      line-height: 1.3;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      color: var(--primary-strong);
      background: rgba(15, 118, 110, .1);
      border: 1px solid rgba(15, 118, 110, .18);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      line-height: 1.2;
    }
    .tag.hot { color: var(--danger); background: rgba(180,35,24,.09); border-color: rgba(180,35,24,.18); }
    .tag.qty { color: var(--accent); background: rgba(180,83,9,.1); border-color: rgba(180,83,9,.18); }
    .entries {
      padding: 12px 14px 14px;
      display: grid;
      gap: 12px;
    }
    .entry-label {
      display: inline-flex;
      width: fit-content;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    ol {
      margin: 0;
      padding-left: 22px;
    }
    li {
      margin: 0 0 6px;
      line-height: 1.45;
    }
    .source {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .empty {
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 26px;
      color: var(--muted);
      text-align: center;
    }
    mark {
      background: rgba(180, 83, 9, .18);
      color: inherit;
      border-radius: 4px;
      padding: 0 2px;
    }
    @media (max-width: 720px) {
      .controls, .stats { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
      main, .topbar { padding-left: 12px; padding-right: 12px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <h1>Sổ tay công thức pha chế & chế biến</h1>
      <div class="controls">
        <div>
          <label for="search">Tìm món, nguyên liệu, định lượng, HSD</label>
          <input id="search" type="search" placeholder="Ví dụ: matcha, 30ml, bánh bao, D+2">
        </div>
        <div>
          <label for="sheetSelect">Nhóm công thức</label>
          <select id="sheetSelect"></select>
        </div>
      </div>
    </div>
  </header>
  <main>
    <section class="stats" aria-label="Tổng quan">
      <div class="stat"><span>Nhóm</span><strong id="sheetCount">0</strong></div>
      <div class="stat"><span>Mục công thức</span><strong id="cardCount">0</strong></div>
      <div class="stat"><span>Đang hiển thị</span><strong id="visibleCount">0</strong></div>
    </section>
    <nav class="tabs" id="tabs" aria-label="Nhóm công thức"></nav>
    <section id="content"></section>
  </main>

 "HSD: D + 20"], "source": "B6"}, {"label": "Công thức", "text": "PhaPhin Soda Cà Phê Yuzu/ Nho Xanh/Cam Đỏ", "steps": ["PhaPhin Soda Cà Phê Yuzu/ Nho Xanh/Cam Đỏ"], "source": "B8"}, {"label": "Cách chế biến", "text": "Cho 30ml (2 bơm) mứt vào ly 16oz\nThêm đá vào cách miệng ly 1cm\nCho 30ml café vào\nCho 100ml soda vào cuối", "steps": ["Cho 30ml (2 bơm) mứt vào ly 16oz", "Thêm đá vào cách miệng ly 1cm", "Cho 30ml café vào", "Cho 100ml soda vào cuối"], "source": "B9"}], "tags": ["HSD: D + 20", "D + 20", "30ml", "16oz"], "source": "Soda+BA warmer!A6"}, {"title": "Soda Yuzu/ Nho Xanh", "entries": [{"label": "Cách chế biến", "text": "Cho 45ml (3 bơm) mứt vào ly 16oz\nThêm đá vào cách miệng ly 1cm\nCho 150ml soda vào cuối", "steps": ["Cho 45ml (3 bơm) mứt vào ly 16oz", "Thêm đá vào cách miệng ly 1cm", "Cho 150ml soda vào cuối"], "source": "B12"}], "tags": ["45ml", "16oz", "150ml"], "source": "Soda+BA warmer!B11"}, {"title": "BAKERY ONSITE", "entries": [{"label": "HSD", "text": "Bánh khoai lang/bánh mè/bánh bơ tỏi/bánh mochi: 6 tiếng", "steps": ["Bánh khoai lang/bánh mè/bánh bơ tỏi/bánh mochi: 6 tiếng"], "source": "B15"}, {"label": "Cách chế biến", "text": "Dùng kéo cắt mở gói, lấy bánh ra khỏi ngăn đông (1 phần = 1 cái)", "steps": ["Dùng kéo cắt mở gói, lấy bánh ra khỏi ngăn đông (1 phần = 1 cái)"], "source": "B16"}, {"label": "Cách chế biến", "text": "Cho sản phẩm lò vi sóng rã đông:\n-Croissant bơ tỏi/ cf/ trà xanh: 1-2 cái/ 2 phút", "steps": ["Cho sản phẩm lò vi sóng rã đông:", "-Croissant bơ tỏi/ cf/ trà xanh: 1-2 cái/ 2 phút"], "source": "B17"}, {"label": "Cách chế biến", "text": "Lấy sản phẩm cho vào warmer để bảo quản.", "steps": ["Lấy sản phẩm cho vào warmer để bảo quản."], "source": "B18"}, {"label": "Cách chế biến", "text": "Cho vào túi giấy bánh mì và bao nilon nếu khách mang đi", "steps": ["Cho vào túi giấy bánh mì và bao nilon nếu khách mang đi"], "source": "B19"}], "tags": ["2 phút"], "source": "Soda+BA warmer!A14"}]}, {"name": "Dimsum", "cards": [{"title": "DIMSUM\nKÈM NƯỚC CHẤM", "entries": [{"label": "HSD", "text": "12 tiếng trong tủ hấp", "steps": ["12 tiếng trong tủ hấp"], "source": "B2"}, {"label": "Định lượng", "text": "Há cảo tôm", "steps": ["Há cảo tôm"], "source": "B3"}], "tags": [], "source": "Dimsum!A1"}, {"title": "Dimsum tam sắc", "entries": [{"label": "Cách chế biến", "text": "Dùng kéo cắt mở gói, lấy số lượng viên bỏ vào hộp mì trộn (tương ứng theo phần)", "steps": ["Dùng kéo cắt mở gói, lấy số lượng viên bỏ vào hộp mì trộn (tương ứng theo phần)"], "source": "B7"}, {"label": "Cách chế biến", "text": "Mở hé nắp hộp và bỏ vào tủ hấp 30 phút trước khi bán cho khách hàng\nTrường hợp khẩn cấp có thể hé nắp hộp và hâm nóng với 1 chén nước nóng:\n- 1 phần: 2 phút 30 giây\n- 2 phần: 3 phút\n- 3 phần: 3 phút 30 giây", "steps": ["Mở hé nắp hộp và bỏ vào tủ hấp 30 phút trước khi bán cho khách hàng", "Trường hợp khẩn cấp có thể hé nắp hộp và hâm nóng với 1 chén nước nóng:", "- 1 phần: 2 phút 30 giây", "- 2 phần: 3 phút", "- 3 phần: 3 phút 30 giây"], "source": "B8"}, {"label": "Cách chế biến", "text": "Mở nắp và múc nước chấm dimsum (2 muỗng ~ 10g) vào hộp\nSau đó hâm nóng với thời gian 10 giây", "steps": ["Mở nắp và múc nước chấm dimsum (2 muỗng ~ 10g) vào hộp", "Sau đó hâm nóng với thời gian 10 giây"], "source": "B9"}, {"label": "Cách chế biến", "text": "Cho vào túi nếu khách mang đi", "steps": ["Cho vào túi nếu khách mang đi"], "source": "B10"}], "tags": ["30 phút", "2 phút", "30 giây", "10 giây", "10g"], "source": "Dimsum!B6"}]}];
    const searchInput = document.getElementById('search');
    const sheetSelect = document.getElementById('sheetSelect');
    const tabs = document.getElementById('tabs');
    const content = document.getElementById('content');
    const sheetCount = document.getElementById('sheetCount');
    const cardCount = document.getElementById('cardCount');
    const visibleCount = document.getElementById('visibleCount');
    let activeSheet = 'all';

    const totalCards = DATA.reduce((sum, sheet) => sum + sheet.cards.length, 0);
    sheetCount.textContent = DATA.length;
    cardCount.textContent = totalCards;

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlight(text, query) {
      const safe = String(text || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[char]));
      if (!query) return safe;
      return safe.replace(new RegExp(escapeRegExp(query), 'ig'), match => `<mark>${match}</mark>`);
    }

    function plainCardText(card, sheetName) {
      return [sheetName, card.title, ...card.tags, ...card.entries.flatMap(entry => [entry.label, entry.text])]
        .join(' ')
        .toLowerCase();
    }

    function tagClass(tag) {
      if (/độ|phút|giây|\bs\b|\bp\b/i.test(tag)) return 'hot';
      if (/ml|g|kg|oz/i.test(tag)) return 'qty';
      return '';
    }

    function renderTabs() {
      const options = [['all', 'Tất cả'], ...DATA.map(sheet => [sheet.name, sheet.name.replaceAll('_', ' ')])];
      sheetSelect.innerHTML = options.map(([value, label]) => `<option value="${value}">${label}</option>`).join('');
      tabs.innerHTML = options.map(([value, label]) => (
        `<button class="tab ${value === activeSheet ? 'active' : ''}" type="button" data-sheet="${value}">${label}</button>`
      )).join('');
      sheetSelect.value = activeSheet;
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      renderTabs();
      let visible = 0;
      const sheetHtml = DATA
        .filter(sheet => activeSheet === 'all' || sheet.name === activeSheet)
        .map(sheet => {
          const cards = sheet.cards.filter(card => plainCardText(card, sheet.name).includes(query));
          visible += cards.length;
          if (!cards.length) return '';
          return `
            <section>
              <div class="sheet-title">
                <h2>${highlight(sheet.name.replaceAll('_', ' '), query)}</h2>
                <span>${cards.length} mục</span>
              </div>
              <div class="grid">
                ${cards.map(card => `
                  <article class="card">
                    <div class="card-head">
                      <h3>${highlight(card.title, query)}</h3>
                      <div class="tags">
                        ${card.tags.slice(0, 8).map(tag => `<span class="tag ${tagClass(tag)}">${highlight(tag, query)}</span>`).join('')}
                      </div>
                    </div>
                    <div class="entries">
                      ${card.entries.map(entry => `
                        <div class="entry">
                          <span class="entry-label">${highlight(entry.label, query)}</span>
                          <ol>
                            ${entry.steps.map(step => `<li>${highlight(step, query)}</li>`).join('')}
                          </ol>
                          <div class="source">${highlight(sheet.name + ' · ' + entry.source, query)}</div>
                        </div>
                      `).join('')}
                    </div>
                  </article>
                `).join('')}
              </div>
            </section>`;
        }).join('');
      visibleCount.textContent = visible;
      content.innerHTML = sheetHtml || '<div class="empty">Không tìm thấy mục phù hợp.</div>';
    }

    tabs.addEventListener('click', event => {
      const button = event.target.closest('button[data-sheet]');
      if (!button) return;
      activeSheet = button.dataset.sheet;
      render();
    });
    sheetSelect.addEventListener('change', event => {
      activeSheet = event.target.value;
      render();
    });
    searchInput.addEventListener('input', render);
    render();
  </script>
